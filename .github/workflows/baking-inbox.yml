name: Baking inbox
on:
  push:
    branches: [main]
    paths:
      - 'recipe-imports/pending/**'
      - 'plan-imports/pending/**'
  workflow_dispatch:
    inputs:
      inbox:
        description: Inbox to process
        type: choice
        options: [recipe, plan]
        required: true
      import_id:
        description: Optional UUID for a single file retry
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: baking-inbox-main
  cancel-in-progress: false

jobs:
  detect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    outputs:
      recipe: ${{ steps.changes.outputs.recipe }}
      plan: ${{ steps.changes.outputs.plan }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changes
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          INBOX: ${{ inputs.inbox }}
        run: |
          set -eu
          if [ "$EVENT" = workflow_dispatch ]; then
            printf '%s=true\n' "$INBOX" >> "$GITHUB_OUTPUT"
          else
            for inbox in recipe plan; do
              files=$(git ls-files -- "$inbox-imports/pending/*.json")
              if [ -n "$files" ]; then
                printf '%s=true\n' "$inbox" >> "$GITHUB_OUTPUT"
              fi
            done
          fi
  recipes:
    needs: detect
    if: needs.detect.outputs.recipe == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          path: inbox
      - uses: actions/checkout@v4
        with:
          # Execute the reviewed importer even when a writer can change inbox content.
          ref: 0545e43bf12be8e9b37e4a0059749a3a6095735a
          persist-credentials: false
          path: runner
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: runner/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: runner
      - run: npm exec --offline -- tsx scripts/sync-inbox.ts recipe
        working-directory: runner
        env:
          IMPORT_INBOX_ROOT: ${{ github.workspace }}/inbox
          IMPORT_DATABASE_URL: ${{ secrets.SUPABASE_RECIPE_IMPORT_DATABASE_URL }}
          IMPORT_ONLY_ID: ${{ inputs.import_id }}
  plans:
    needs: detect
    if: needs.detect.outputs.plan == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          path: inbox
      - uses: actions/checkout@v4
        with:
          # Execute the reviewed importer even when a writer can change inbox content.
          ref: 0545e43bf12be8e9b37e4a0059749a3a6095735a
          persist-credentials: false
          path: runner
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: runner/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: runner
      - run: npm exec --offline -- tsx scripts/sync-inbox.ts plan
        working-directory: runner
        env:
          IMPORT_INBOX_ROOT: ${{ github.workspace }}/inbox
          IMPORT_DATABASE_URL: ${{ secrets.SUPABASE_PLAN_IMPORT_DATABASE_URL }}
          IMPORT_ONLY_ID: ${{ inputs.import_id }}
